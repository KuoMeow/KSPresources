<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三位數加法練習 - 範圍：三上數學 第二單元：四位數的加減</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdfa;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 30px 30px;
            touch-action: manipulation;
        }

        /* 一般填寫空格 */
        .slot {
            width: 90px;
            height: 80px;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #334155;
            transition: all 0.3s;
            background-color: #f8fafc;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .slot:disabled {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* 進位用的較小空格 */
        .slot-carry {
            width: 45px;
            height: 45px;
            border: 2px dashed #94a3b8;
            border-radius: 50%;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #ef4444;
            transition: all 0.3s;
            background-color: #fff;
        }
        .slot-carry:disabled {
            background-color: transparent;
            border-color: transparent;
            color: #ef4444;
            box-shadow: none;
        }

        /* 焦點與高亮動畫 */
        @keyframes flashBorder {
            0% { box-shadow: 0 0 0px #3b82f6; border-color: #3b82f6; }
            50% { box-shadow: 0 0 15px #3b82f6; border-color: #2563eb; background-color: #eff6ff;}
            100% { box-shadow: 0 0 0px #3b82f6; border-color: #3b82f6; }
        }
        .slot.active-target, .slot-carry.active-target {
            border-color: #3b82f6;
            background-color: #eff6ff;
            animation: flashBorder 1.5s infinite;
            outline: none;
        }
        
        /* 錯誤閃爍動畫 */
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); border-color: #ef4444; background-color: #fef2f2;}
            40%, 80% { transform: translateX(5px); border-color: #ef4444; background-color: #fef2f2;}
        }
        .error-shake {
            animation: shakeError 0.5s ease-in-out;
        }

        /* 答對按讚動畫 */
        @keyframes popUpThumbs {
            0% { transform: scale(0); opacity: 0; }
            20% { transform: scale(1.3) rotate(-10deg); opacity: 1; }
            40% { transform: scale(1) rotate(5deg); opacity: 1; }
            60% { transform: scale(1.1) rotate(-5deg); opacity: 1; }
            80% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .praise-anim {
            animation: popUpThumbs 1.5s ease-in-out forwards;
        }

        /* 定位板表頭 - 調整高度與大小，確保積木大小適中 */
        .place-header {
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            padding: 8px 4px;
            width: 85px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .bg-hundreds { background-color: #e0f2fe; color: #0369a1; }
        .bg-tens { background-color: #ffedd5; color: #c2410c; }
        .bg-ones { background-color: #f1f5f9; color: #475569; }

        /* 3D 按鈕效果 */
        .btn-3d-green {
            transition: all 0.1s;
            box-shadow: 0 6px 0 #16a34a;
        }
        .btn-3d-green:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #16a34a;
        }

        /* 彩蛋文字動畫 */
        @keyframes superPop {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            70% { transform: scale(0.9) rotate(-3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .super-pop-anim {
            animation: superPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }


        /* ===== 美化版：課堂投影友善版面 ===== */
        :root {
            --ink: #334155;
            --muted: #64748b;
            --lavender: #eef2ff;
            --lavender-deep: #6366f1;
            --rose-soft: #fff1f2;
            --blue-soft: #eff6ff;
            --mint-soft: #ecfdf5;
        }

        body {
            color: var(--ink);
            background-color: #f8fafc;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(199,210,254,.45) 0, rgba(199,210,254,0) 28%),
                radial-gradient(circle at 88% 12%, rgba(251,207,232,.35) 0, rgba(251,207,232,0) 25%),
                radial-gradient(#dbeafe 1.4px, transparent 1.4px);
            background-size: auto, auto, 30px 30px;
        }

        .topbar {
            background: rgba(255,255,255,.94);
            color: #312e81;
            border-bottom: 1px solid #e0e7ff;
            box-shadow: 0 8px 24px rgba(99,102,241,.10);
            backdrop-filter: blur(16px);
        }

        .main-shell {
            background: rgba(255,255,255,.82);
            border: 1px solid rgba(255,255,255,.95);
            box-shadow: 0 22px 60px rgba(51,65,85,.12);
        }

        .question-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8faff 100%);
            border: 2px solid #e0e7ff;
            box-shadow: 0 14px 30px rgba(99,102,241,.09);
        }

        .step-card {
            background: linear-gradient(145deg, #eff6ff 0%, #f8fbff 100%);
            border: 2px solid #bfdbfe;
            box-shadow: 0 12px 28px rgba(59,130,246,.09);
        }

        .board-card {
            background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
            border: 2px solid #e0e7ff;
            box-shadow: 0 16px 36px rgba(51,65,85,.10);
        }

        .section-label {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: .12em;
            color: #4338ca;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 6px 12px;
            border-radius: 999px;
        }

        .slot {
            width: 108px;
            height: 96px;
            border-width: 3px;
            border-radius: 20px;
            font-size: 56px;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(51,65,85,.06), inset 0 1px 0 rgba(255,255,255,.8);
        }

        .slot-carry {
            width: 54px;
            height: 54px;
            font-size: 30px;
            border: 2px dashed #f59e0b;
            background: #fffbeb;
            box-shadow: 0 4px 12px rgba(245,158,11,.08);
        }

        .place-header {
            min-height: 116px;
            width: 104px;
            font-size: 24px;
            border: 1px solid rgba(148,163,184,.18);
            box-shadow: 0 5px 14px rgba(51,65,85,.05);
            justify-content: center;
        }

        /* 十進位積木：統一以 7px 為 1 個單位 */
        .base10-hundred { width: 70px; height: 70px; }
        .base10-ten { width: 7px; height: 70px; }
        .base10-one { width: 7px; height: 7px; }

        .question-nav {
            background: rgba(255,255,255,.9);
            border: 1px solid #e2e8f0;
            box-shadow: 0 16px 36px rgba(51,65,85,.10);
        }

        @media (max-width: 1100px) {
            .learning-grid { grid-template-columns: 1fr !important; }
            .left-learning { min-height: auto !important; }
            .slot { width: 92px; height: 82px; font-size: 46px; }
            .slot-carry { width: 48px; height: 48px; font-size: 26px; }
            .place-header { min-height: 104px; width: 94px; font-size: 22px; }
            .base10-hundred { width: 62px; height: 62px; }
            .base10-ten { width: 6.2px; height: 62px; }
            .base10-one { width: 6.2px; height: 6.2px; }
            .main-shell { overflow-y: auto; }
        }

    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 導覽列 -->
    <nav class="topbar px-6 py-4 flex justify-between items-center z-10 shrink-0">
        <div class="text-3xl font-black flex items-center gap-3 text-indigo-950">
            <div class="bg-indigo-50 p-2 rounded-2xl border border-indigo-100">
                <!-- 可愛小熊頭向量插圖 -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-amber-400" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C9 2 7 4 7 6V7C4.5 7 3 9 3 11.5C3 14 5 16 7.5 16H8.5C9.5 18 11 19 12 19C13 19 14.5 18 15.5 16H16.5C19 16 21 14 21 11.5C21 9 19.5 7 17 7V6C17 4 15 2 12 2ZM7 9C7.8 9 8.5 9.7 8.5 10.5C8.5 11.3 7.8 12 7 12C6.2 12 5.5 11.3 5.5 10.5C5.5 9.7 6.2 9 7 9ZM17 9C17.8 9 18.5 9.7 18.5 10.5C18.5 11.3 17.8 12 17 12C16.2 12 15.5 11.3 15.5 10.5C15.5 9.7 16.2 9 17 9ZM12 15C10.5 15 9.5 13.8 9.5 13.5H14.5C14.5 13.8 13.5 15 12 15Z"/>
                </svg>
            </div>
            <span class="drop-shadow-sm">三位數加法練習</span> <span class="text-base bg-indigo-100 text-indigo-800 border border-indigo-200 px-4 py-1.5 rounded-full font-black">範圍：三上數學 第二單元：四位數的加減</span>
        </div>
        <div class="flex gap-6 text-xl font-bold items-center">
            <div class="bg-white border-2 border-amber-300 px-6 py-3 rounded-2xl shadow-sm flex items-center gap-3 text-slate-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
                得分: <span id="score-display" class="text-indigo-700 text-3xl font-black">0</span>
            </div>
        </div>
    </nav>

    <!-- 主要內容區：題號導覽＋左右雙欄學習區 -->
    <main class="flex-1 flex overflow-hidden p-4 lg:p-5 gap-4 lg:gap-5 justify-center">
        <!-- 左側題號導覽 -->
        <aside class="question-nav w-20 lg:w-24 rounded-[28px] p-3 flex flex-col items-center gap-3 shrink-0 overflow-y-auto">
            <div class="text-xs font-black text-indigo-400 tracking-[0.2em] mt-1 mb-1">題號</div>
            <div class="flex flex-col gap-3 w-full items-center" id="nav-questions">
                <!-- 動態生成 -->
            </div>
        </aside>

        <!-- 主學習區 -->
        <div class="main-shell flex-1 max-w-[1320px] rounded-[34px] p-4 lg:p-6 overflow-hidden relative">
            <div class="learning-grid grid grid-cols-[0.9fr_1.35fr] gap-5 h-full min-h-0">

                <!-- 左半部：橫式＋步驟 -->
                <section class="left-learning min-h-0 flex flex-col gap-5">
                    <!-- 橫式題目 -->
                    <div class="question-card rounded-[28px] p-6 lg:p-7 relative flex-1 min-h-[270px] flex flex-col justify-center">
                        <div class="absolute top-4 left-5 section-label">橫式題目</div>
                        <div class="absolute top-4 right-5 text-amber-300 opacity-80">
                            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        </div>

                        <div class="mt-10 flex flex-col items-center gap-5">
                            <span id="current-q-badge" class="bg-indigo-700 text-white text-2xl font-black px-6 py-3 rounded-[20px] shadow-md shadow-indigo-200">第 1 題</span>
                            <div id="question-text" class="flex flex-wrap items-center justify-center gap-5 text-5xl xl:text-6xl font-black tracking-wider text-slate-800">
                                <!-- 動態題目 -->
                            </div>
                            <p class="text-xl lg:text-2xl font-bold text-slate-500">先看橫式，再把數字放到正確的位值。</p>
                        </div>
                    </div>

                    <!-- 解題步驟 -->
                    <div class="step-card rounded-[28px] p-6 lg:p-7 relative flex-1 min-h-[270px] flex flex-col justify-center">
                        <div class="absolute top-4 left-5 section-label !bg-blue-50 !text-blue-600 !border-blue-200">解題步驟</div>

                        <div class="mt-9 flex items-center gap-4">
                            <div class="w-20 h-20 rounded-2xl bg-blue-700 text-white flex items-center justify-center shadow-lg shadow-blue-200 shrink-0">
                                <span class="text-4xl font-black" id="step-number">1</span>
                            </div>
                            <div class="flex-1 bg-white/90 border-2 border-blue-100 rounded-2xl px-6 py-6 shadow-sm">
                                <span class="text-3xl lg:text-4xl font-black text-slate-800 leading-relaxed" id="step-instruction">請把數字填入直式裡。</span>
                            </div>
                            <button onclick="playInstruction()" class="bg-amber-400 hover:bg-amber-300 text-white p-3 rounded-2xl shadow-md transition-transform transform hover:scale-105 active:scale-95 focus:outline-none flex-shrink-0 border-2 border-amber-200" title="語音報讀">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                </svg>
                            </button>
                        </div>

                        <div class="mt-4 min-h-[44px] flex items-center justify-center">
                            <div id="feedback-msg" class="text-3xl font-black text-center transition-opacity opacity-0">
                                <!-- 動態訊息 -->
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 右半部：直式定位板 -->
                <section class="board-card rounded-[30px] p-6 lg:p-8 relative min-h-0 overflow-auto flex flex-col justify-center">
                    <div class="absolute top-4 left-5 section-label !bg-purple-50 !text-purple-600 !border-purple-200">直式計算</div>
                    <div class="absolute top-5 right-6 flex gap-2 opacity-70">
                        <span class="w-3 h-3 rounded-full bg-rose-200"></span>
                        <span class="w-3 h-3 rounded-full bg-amber-200"></span>
                        <span class="w-3 h-3 rounded-full bg-emerald-200"></span>
                    </div>

                    <div class="grid grid-cols-4 gap-x-6 lg:gap-x-9 gap-y-5 items-center w-max mx-auto relative pt-12">
                        <!-- 表頭 -->
                        <div></div>

                        <!-- 百位 -->
                        <div class="place-header bg-hundreds">
                            <div class="h-[72px] w-[72px] flex items-center justify-center">
                                <svg class="base10-hundred drop-shadow-sm" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="百位：10乘10，共100格">
                                    <rect x="0.75" y="0.75" width="98.5" height="98.5" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
                                    <path d="M10 0v100 M20 0v100 M30 0v100 M40 0v100 M50 0v100 M60 0v100 M70 0v100 M80 0v100 M90 0v100 M0 10h100 M0 20h100 M0 30h100 M0 40h100 M0 50h100 M0 60h100 M0 70h100 M0 80h100 M0 90h100" stroke="#38bdf8" stroke-width="1"/>
                                </svg>
                            </div>
                            <span>百</span>
                        </div>

                        <!-- 十位 -->
                        <div class="place-header bg-tens">
                            <div class="h-[72px] w-[18px] flex items-center justify-center">
                                <svg class="base10-ten drop-shadow-sm" viewBox="0 0 10 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-label="十位：10個一格排成一條">
                                    <rect x="0.5" y="0.5" width="9" height="99" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
                                    <path d="M0 10h10 M0 20h10 M0 30h10 M0 40h10 M0 50h10 M0 60h10 M0 70h10 M0 80h10 M0 90h10" stroke="#f97316" stroke-width="0.8"/>
                                </svg>
                            </div>
                            <span>十</span>
                        </div>

                        <!-- 個位 -->
                        <div class="place-header bg-ones">
                            <div class="h-[72px] w-[72px] flex items-center justify-center">
                                <svg class="base10-one drop-shadow-sm" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg" aria-label="個位：1格">
                                    <rect x="0.5" y="0.5" width="9" height="9" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
                                </svg>
                            </div>
                            <span>個</span>
                        </div>

                        <!-- 進位列 -->
                        <div class="text-right text-base font-black text-amber-600 pr-1">進位</div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot-carry" id="c100" disabled></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot-carry" id="c10" disabled></div>
                        <div></div>

                        <!-- 加數 1 -->
                        <div></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="n1_100" disabled></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="n1_10" disabled></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="n1_1" disabled></div>

                        <!-- 加數 2 -->
                        <div class="flex items-center justify-center text-7xl font-black text-rose-500">+</div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="n2_100" disabled></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="n2_10" disabled></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="n2_1" disabled></div>

                        <div class="col-span-4 border-b-[8px] border-slate-800 my-2 rounded-full"></div>

                        <!-- 和 -->
                        <div></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="a_100" disabled></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="a_10" disabled></div>
                        <div class="flex justify-center"><input type="text" inputmode="decimal" maxlength="1" class="slot" id="a_1" disabled></div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- 結算視窗 -->
    <div id="result-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-[40px] shadow-2xl p-12 max-w-2xl w-full text-center transform scale-95 transition-transform duration-300 border-8 border-indigo-100 relative">
            <div class="absolute -top-16 left-1/2 transform -translate-x-1/2 text-7xl drop-shadow-lg">🎉</div>
            <h2 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-500 mb-6 flex justify-center items-center gap-4 mt-4 drop-shadow-sm">
                恭喜完成！
            </h2>
            <p class="text-3xl text-gray-600 mb-8 font-bold">你已經完成所有題目囉！</p>
            <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-3xl p-8 mb-10 inline-block text-left mx-auto border-2 border-indigo-100 shadow-inner">
                <p class="text-3xl text-gray-800 font-bold flex items-center gap-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-yellow-400 drop-shadow" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                    </svg>
                    總得分：<span id="final-score" class="text-blue-600 text-5xl ml-2 font-black">0</span> 
                    <span class="text-2xl text-gray-500 ml-1">分</span>
                </p>
            </div>
            <div class="flex justify-center gap-6">
                <button onclick="location.reload()" class="btn-3d-green bg-green-500 hover:bg-green-400 text-white text-3xl font-bold py-4 px-12 rounded-2xl">
                    再玩一次
                </button>
            </div>
        </div>
    </div>

    <!-- 按讚動畫層 (右側空白處) -->
    <div id="praise-overlay" class="fixed right-12 top-1/2 transform -translate-y-1/2 pointer-events-none flex items-center justify-center z-50 hidden">
        <div class="text-[140px] drop-shadow-2xl origin-center">👍</div>
    </div>

    <!-- 彩蛋動畫層 -->
    <div id="easter-egg-overlay" class="fixed inset-0 pointer-events-none flex items-center justify-center z-50 hidden overflow-hidden">
        <div id="easter-egg-text" class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-pink-500 drop-shadow-[0_10px_10px_rgba(0,0,0,0.3)] filter pb-4">
            你真厲害！
        </div>
    </div>

    <script>
        // 題目資料 (6題)
        const questionsData = [
            { n1: "123", n2: "456", a: "579", c10: false, c100: false },
            { n1: "245", n2: "138", a: "383", c10: true,  c100: false },
            { n1: "362", n2: "471", a: "833", c10: false, c100: true  },
            { n1: "589", n2: "246", a: "835", c10: true,  c100: true  },
            { n1: "485", n2: "342", a: "827", c10: false, c100: true  },
            { n1: "678", n2: "254", a: "932", c10: true,  c100: true  }
        ];

        let currentQIndex = 0;
        let currentPhase = 0; // 0: 填加數, 1: 加個位, 2: 加十位, 3: 加百位
        let score = 0;
        let activeTargetInputs = [];

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.1;
                utterance.pitch = 1.5;
                window.speechSynthesis.speak(utterance);
            }
        }

        function playInstruction() {
            const num = document.getElementById('step-number').innerText;
            const text = document.getElementById('step-instruction').innerText;
            speak(`步驟${num}，${text}`);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); 
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); 
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        window.onload = () => {
            initNav();
            loadQuestion(0);
            bindInputEvents();
        };

        function initNav() {
            const nav = document.getElementById('nav-questions');
            nav.innerHTML = '';
            questionsData.forEach((_, idx) => {
                const btn = document.createElement('div');
                btn.className = `w-12 h-12 flex items-center justify-center rounded-2xl text-xl font-black border transition-all ${idx === 0 ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-200 scale-105' : 'bg-white text-slate-500 border-slate-200 shadow-sm'}`;
                btn.innerText = idx + 1;
                btn.id = `nav-btn-${idx}`;
                nav.appendChild(btn);
            });
        }

        function updateNav() {
            questionsData.forEach((_, idx) => {
                const btn = document.getElementById(`nav-btn-${idx}`);
                if (idx === currentQIndex) {
                    btn.className = 'w-12 h-12 flex items-center justify-center rounded-2xl text-xl font-black border bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-200 scale-105';
                } else if (idx < currentQIndex) {
                    btn.className = 'w-12 h-12 flex items-center justify-center rounded-2xl text-xl font-black border bg-emerald-50 text-emerald-600 border-emerald-200';
                } else {
                    btn.className = 'w-12 h-12 flex items-center justify-center rounded-2xl text-xl font-black border bg-white text-slate-400 border-slate-200';
                }
            });
        }

        function clearBoard() {
            const allInputs = document.querySelectorAll('input.slot, input.slot-carry');
            allInputs.forEach(input => {
                input.value = '';
                input.disabled = true;
                input.classList.remove('active-target', 'error-shake');
                input.style.backgroundColor = '#f8fafc';
                input.style.borderColor = '#cbd5e1';
                input.style.visibility = 'visible';
            });
            document.getElementById('c100').style.visibility = 'hidden';
            document.getElementById('c10').style.visibility = 'hidden';
        }

        function loadQuestion(index) {
            currentQIndex = index;
            currentPhase = 0;
            const q = questionsData[index];
            
            document.getElementById('current-q-badge').innerText = `第 ${index + 1} 題`;
            document.getElementById('question-text').innerHTML = `
                <span>${q.n1}</span>
                <span class="text-pink-500">+</span>
                <span>${q.n2}</span>
                <span class="text-pink-500">=</span>
                <span class="w-20 h-16 border-[3px] border-dashed border-slate-400 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400 font-black text-3xl">?</span>
            `;
            
            updateNav();
            clearBoard();
            
            if(q.c10) document.getElementById('c10').style.visibility = 'visible';
            if(q.c100) document.getElementById('c100').style.visibility = 'visible';

            setupPhase();
        }

        function setupPhase() {
            const q = questionsData[currentQIndex];
            activeTargetInputs = [];
            
            const stepNum = document.getElementById('step-number');
            const stepInst = document.getElementById('step-instruction');

            if (currentPhase === 0) {
                stepNum.innerText = "1";
                stepInst.innerText = "請把數字填入直式裡。";
                activeTargetInputs = ['n1_100', 'n1_10', 'n1_1', 'n2_100', 'n2_10', 'n2_1'];
            } else if (currentPhase === 1) {
                stepNum.innerText = "2";
                stepInst.innerText = "先算「個位」。";
                activeTargetInputs.push('a_1');
                if(q.c10) activeTargetInputs.push('c10'); 
            } else if (currentPhase === 2) {
                stepNum.innerText = "3";
                stepInst.innerText = "再算「十位」。";
                activeTargetInputs.push('a_10');
                if(q.c100) activeTargetInputs.push('c100');
            } else if (currentPhase === 3) {
                stepNum.innerText = "4";
                stepInst.innerText = "最後算「百位」。";
                activeTargetInputs.push('a_100');
            }

            activeTargetInputs.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = false;
            });

            updateFocusHighlight();
        }

        function updateFocusHighlight() {
            activeTargetInputs.forEach(id => {
                document.getElementById(id).classList.remove('active-target');
            });

            for (let id of activeTargetInputs) {
                const el = document.getElementById(id);
                if (el.value === '') {
                    el.classList.add('active-target');
                    el.focus();
                    break;
                }
            }
        }

        function bindInputEvents() {
            const allInputs = document.querySelectorAll('input');
            allInputs.forEach(input => {
                input.addEventListener('input', () => {
                    input.value = input.value.replace(/[^0-9]/g, '');
                    if (input.value !== '') {
                        checkSlot(input);
                    }
                });

                input.addEventListener('click', () => {
                    if (!input.disabled) {
                        input.value = '';
                        updateFocusHighlight();
                        input.classList.add('active-target');
                    }
                });
            });
        }

        function checkSlot(input) {
            const q = questionsData[currentQIndex];
            const expectedValues = {
                'n1_100': q.n1[0], 'n1_10': q.n1[1], 'n1_1': q.n1[2],
                'n2_100': q.n2[0], 'n2_10': q.n2[1], 'n2_1': q.n2[2],
                'a_1': q.a[2], 'c10': '1',
                'a_10': q.a[1], 'c100': '1',
                'a_100': q.a[0]
            };
            
            const expected = expectedValues[input.id];
            
            if (input.value === expected) {
                input.disabled = true;
                input.classList.remove('active-target', 'error-shake');
                input.style.backgroundColor = '#f0fdf4';
                input.style.borderColor = '#86efac';
                
                activeTargetInputs = activeTargetInputs.filter(id => id !== input.id);
                
                if (activeTargetInputs.length === 0) {
                    completePhase();
                } else {
                    updateFocusHighlight();
                }
            } else {
                input.classList.add('error-shake');
                playSound('incorrect');
                setTimeout(() => {
                    input.classList.remove('error-shake');
                    input.value = '';
                }, 500);
            }
        }

        function showMessage(msg, isError = false) {
            const fb = document.getElementById('feedback-msg');
            fb.innerText = msg;
            fb.className = `text-2xl font-bold text-center h-8 transition-opacity duration-300 opacity-100 ${isError ? 'text-red-500' : 'text-green-600'}`;
            setTimeout(() => {
                fb.classList.replace('opacity-100', 'opacity-0');
            }, 2500);
        }

        function triggerEasterEgg() {
            const overlay = document.getElementById('easter-egg-overlay');
            const textElement = document.getElementById('easter-egg-text');
            overlay.classList.remove('hidden');
            textElement.classList.add('super-pop-anim');
            
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#fde047'];
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.classList.add('absolute', 'w-4', 'h-4', 'rounded-sm');
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '50%';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 150 + Math.random() * 400;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                const rot = Math.random() * 720 - 360;
                
                particle.animate([
                    { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });
                
                overlay.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }

            setTimeout(() => {
                textElement.classList.remove('super-pop-anim');
                overlay.classList.add('hidden');
            }, 2500);
        }

        function completePhase() {
            const q = questionsData[currentQIndex];
            
            if (currentPhase === 3) {
                speak('答對了，你真厲害！');
                showMessage('答對了，你真厲害！');
                playSound('correct');
                triggerEasterEgg();
            } else {
                speak('正確！');
                showMessage('正確！');
                playSound('correct');
                
                const overlay = document.getElementById('praise-overlay');
                overlay.classList.remove('hidden');
                overlay.querySelector('div').classList.add('praise-anim');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.querySelector('div').classList.remove('praise-anim');
                }, 1500);
            }

            score += 10;
            document.getElementById('score-display').innerText = score;

            currentPhase++;
            if (currentPhase > 3) {
                setTimeout(() => {
                    document.getElementById('question-text').innerHTML = `
                        <span>${q.n1}</span>
                        <span class="text-pink-500">+</span>
                        <span>${q.n2}</span>
                        <span class="text-pink-500">=</span>
                        <span class="w-24 h-16 border-[3px] border-green-400 rounded-2xl bg-green-100 flex items-center justify-center text-green-700 font-black text-3xl shadow-inner">${q.a}</span>
                    `;
                    
                    setTimeout(() => {
                        if (currentQIndex < questionsData.length - 1) {
                            loadQuestion(currentQIndex + 1);
                        } else {
                            showResult();
                        }
                    }, 1500);
                }, 500);
            } else {
                setupPhase();
            }
        }

        function showResult() {
            document.getElementById('final-score').innerText = score;
            const modal = document.getElementById('result-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }
    </script>
</body>
</html>
