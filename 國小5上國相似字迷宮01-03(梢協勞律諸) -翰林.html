<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國小5上國相似字迷宮01-03(梢協勞律諸)-翰林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 低視力版：16:9 舞台（1600×900 設計尺寸，自動縮放）、標楷體、大字、高對比迷宮 */
:root{
  --frame:#2B2B2B; --stage:#FFFDF4; --panel:#FFFFFF; --ink:#000000; --muted:#333333;
  --wall:#000000; --path:#FFFFFF; --trail:#BFE0FF;
  --tile:#FFD400; --tile-ink:#000000; --done:#8FD19E; --done-ink:#000000;
  --end:#1B6E30; --end-ink:#FFFFFF;
  --player:#E0002A; --line:#000000; --accent:#1B4FA0; --accent-ink:#FFFFFF;
  --bad:#B00020; --good:#1B6E30; --soft:#F1EEE2;
  --kai:"DFKai-SB","標楷體","BiauKai","TW-Kai","LXGW WenKai TC","KaiTi",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --frame:#000; --stage:#111111; --panel:#1C1C1C; --ink:#FFFFFF; --muted:#E6E6E6;
  --wall:#FFFFFF; --path:#000000; --trail:#1E3D63;
  --tile:#FFD400; --tile-ink:#000000; --done:#5FBF77; --done-ink:#000000;
  --end:#5FBF77; --end-ink:#000000;
  --player:#FF4D5E; --line:#FFFFFF; --accent:#FFD400; --accent-ink:#000000;
  --bad:#FF7A85; --good:#7BE08F; --soft:#262626; color-scheme:dark}}
:root[data-theme="dark"]{
  --frame:#000; --stage:#111111; --panel:#1C1C1C; --ink:#FFFFFF; --muted:#E6E6E6;
  --wall:#FFFFFF; --path:#000000; --trail:#1E3D63;
  --tile:#FFD400; --tile-ink:#000000; --done:#5FBF77; --done-ink:#000000;
  --end:#5FBF77; --end-ink:#000000;
  --player:#FF4D5E; --line:#FFFFFF; --accent:#FFD400; --accent-ink:#000000;
  --bad:#FF7A85; --good:#7BE08F; --soft:#262626; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,b,th,strong{font-weight:400}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--frame);color:var(--ink);font-family:var(--kai);line-height:1.4}
button,select,input{font-family:var(--kai)}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--stage);
  display:grid;grid-template-columns:1010px 1fr;gap:28px;padding:18px 24px 18px 18px}
#cv{width:1010px;height:864px;display:block;touch-action:none;border-radius:8px}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
h1{margin:0;font-size:64px;line-height:1.05;font-weight:400}
h1{white-space:nowrap}
.h1s{font-size:.6em}
.sub{margin:6px 0 0;font-size:28px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.gsel{display:flex;align-items:center;gap:14px;font-size:32px}
.gsel select{font-size:32px;padding:6px 12px;flex:1;min-width:0;cursor:pointer}
.chip{font-size:32px;font-weight:400;border:3px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 20px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:6px solid var(--player);outline-offset:3px}
.lbl{font-size:26px;font-weight:400;color:var(--muted);margin:0 0 8px}
.goal{display:flex;flex-wrap:wrap;gap:12px}
.goal span{font-size:56px;width:74px;height:74px;display:grid;place-items:center;border-radius:12px;background:var(--tile);color:var(--tile-ink);border:3px solid #000;font-weight:400}
.goal span.ok{background:var(--done);color:var(--done-ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-variant-numeric:tabular-nums}
.stats div{background:var(--soft);border-radius:12px;padding:6px 10px}
.stats b{display:block;font-size:42px;line-height:1.1}
.stats small{font-size:24px;color:var(--muted)}
.stats .hit{animation:hit .6s}
@keyframes hit{0%,100%{background:var(--soft)}30%{background:#FF9AA8;transform:scale(1.08)}}
.bottom{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:auto}
.pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,72px);gap:8px}
.pad button{font-size:40px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer}
.pad button:active{background:var(--tile);color:#000}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.set{display:grid;gap:12px;font-size:28px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select{font-size:28px;padding:4px 8px;border-radius:10px;border:3px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=checkbox]{width:30px;height:30px}
label.tg{display:flex;gap:10px;align-items:center;cursor:pointer}
.btn{font-size:30px;border:3px solid var(--accent);border-radius:14px;padding:8px 22px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:400}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
/* 對話框（在舞台內） */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:10}
.dlg{background:var(--panel);border:4px solid var(--line);border-radius:28px;width:1120px;max-height:840px;overflow:auto;padding:34px 40px;display:grid;gap:24px;justify-items:center;text-align:center}
.step{font-size:34px;font-weight:400;color:var(--muted);letter-spacing:.1em}
.big{display:flex;flex-direction:column;align-items:center;gap:6px}
.big .ch{font-size:300px;line-height:1}
.zy{font-size:64px;line-height:1;font-weight:400;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
:root[data-theme="dark"] .zy{color:var(--tile)}
.word{font-size:150px;line-height:1.1;letter-spacing:.06em;font-weight:400}
.word .blank{display:inline-block;width:1.05em;height:1.05em;border:8px dashed var(--player);border-radius:16px;vertical-align:-.14em;margin:0 .02em}
.word .hl{color:var(--player)}
.opts{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.opt{font-size:110px;width:150px;height:150px;border-radius:20px;border:5px solid var(--line);background:var(--path);color:var(--ink);cursor:pointer;line-height:1;padding:0}
.opt.wrong{border-color:var(--bad);background:#FFE3E6;color:#000;animation:shake .35s}
.opt.right{border-color:var(--good);background:var(--done);color:#000}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fb{min-height:1.4em;margin:0;font-size:40px;font-weight:400}
.fb.bad{color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.words span{font-size:64px;background:var(--soft);border-radius:14px;padding:6px 22px}
.praise{display:grid;justify-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.praise .thumb{font-size:150px;line-height:1}
.praise .yay{font-size:80px;font-weight:400;color:var(--good)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
/* 到家慶祝 */
#party{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none;z-index:20}
.home{display:flex;align-items:flex-end;gap:10px}
.egg{position:relative;font-size:150px;line-height:1;background:none;border:0;padding:0;cursor:pointer;animation:dance .8s ease-in-out infinite alternate}
.egg .crown{position:absolute;left:50%;top:-58px;transform:translateX(-50%);font-size:80px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.house{font-size:150px;line-height:1}
.eggmsg{font-size:44px;margin:0;min-height:1.3em;color:var(--accent)}
:root[data-theme="dark"] .eggmsg{color:var(--tile)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eggmsg{color:var(--tile)}}
.tip{font-size:28px;color:var(--muted);margin:0}
@keyframes dance{0%{transform:translateY(0) rotate(-8deg)}100%{transform:translateY(-22px) rotate(8deg)}}
@keyframes boing{0%,100%{transform:scale(1)}40%{transform:scale(1.25) rotate(-10deg)}70%{transform:scale(.9) rotate(6deg)}}
.egg.boing{animation:boing .5s}
@media (prefers-reduced-motion:reduce){.opt.wrong,.praise,.egg,.egg.boing{animation:none}}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle;font-size:34px}
th{font-size:26px;color:var(--muted)}
td.c{font-size:64px;line-height:1;font-weight:400}
tr.gstart td{border-top:5px solid var(--line)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="迷宮，用方向鍵或右邊的箭頭按鈕移動"></canvas>
  <div class="side">
    <div>
      <h1>相似字迷宮<span class="h1s">（五上）</span></h1>
      <p class="sub">翰林五上 1～3課｜小心怪獸！</p>
    </div>
    <label class="gsel"><span>字群選擇</span><select id="groups"></select></label>
    <div class="goal" id="goal" aria-label="要找的字"></div>
    <div class="stats">
      <div><b id="sDone">0/0</b><small>完成</small></div>
      <div id="sScoreBox"><b id="sScore">100</b><small>分數</small></div>
      <div><b id="sWrong">0</b><small>選錯</small></div>
      <div><b id="sTime">0:00</b><small>時間</small></div>
    </div>
    <div class="bottom">
      <div class="pad" aria-label="方向按鈕">
        <button class="up" data-d="0,-1" aria-label="上">▲</button>
        <button class="left" data-d="-1,0" aria-label="左">◀</button>
        <button class="down" data-d="0,1" aria-label="下">▼</button>
        <button class="right" data-d="1,0" aria-label="右">▶</button>
      </div>
      <div class="set">
        <select id="size" aria-label="迷宮大小">
          <option value="7,6,1">很簡單 7×6</option>
          <option value="9,8,2" selected>簡單 9×8</option>
          <option value="11,10,3">普通 11×10</option>
        </select>
        <div class="row">
          <label class="tg"><input type="checkbox" id="zyOn" checked> 注音</label>
          <label class="tg"><input type="checkbox" id="monOn" checked> 怪獸</label>
        </div>
        <div class="row">
          <button class="btn" id="newMaze">換迷宮</button>
          <button class="btn ghost" id="showRef">字卡</button>
        </div>
      </div>
    </div>
  </div>
  <div class="ov" id="ov" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dStep" id="dlg"></div>
  </div>
  <canvas id="party" aria-hidden="true"></canvas>
</div>

<script>
/* 字組：翰林 國小五上 第1～3課（依檔名順序：梢、協、勞、律、諸） */
const G=[
 {n:'梢組',a:[{c:'梢',z:'ㄕㄠ',w:['末梢','眉梢']},{c:'悄',z:'ㄑㄧㄠˇ',w:['靜悄悄']},{c:'稍',z:'ㄕㄠ',w:['稍微','稍息']},{c:'銷',z:'ㄒㄧㄠ',w:['推銷','開銷']},{c:'消',z:'ㄒㄧㄠ',w:['消除','消失']},{c:'捎',z:'ㄕㄠ',w:['捎來','捎信']}]},
 {n:'協組',a:[{c:'協',z:'ㄒㄧㄝˊ',w:['妥協','協會']},{c:'荔',z:'ㄌㄧˋ',w:['荔枝']},{c:'脅',z:'ㄒㄧㄝˊ',w:['脅迫','威脅']}]},
 {n:'勞組',a:[{c:'勞',z:'ㄌㄠˊ',w:['勞累','辛勞']},{c:'榮',z:'ㄖㄨㄥˊ',w:['榮幸','榮耀']},{c:'營',z:'ㄧㄥˊ',w:['營養','露營']}]},
 {n:'律組',a:[{c:'律',z:'ㄌㄩˋ',w:['規律','律師']},{c:'津',z:'ㄐㄧㄣ',w:['津津有味','津貼']},{c:'筆',z:'ㄅㄧˇ',w:['毛筆','筆挺']},{c:'建',z:'ㄐㄧㄢˋ',w:['建立','建設']}]},
 {n:'諸組',a:[{c:'諸',z:'ㄓㄨ',w:['諸位','諸侯']},{c:'賭',z:'ㄉㄨˇ',w:['賭注','賭博']},{c:'堵',z:'ㄉㄨˇ',w:['堵塞','防堵']},{c:'睹',z:'ㄉㄨˇ',w:['有目共睹']}]}
];
G.forEach((g,gi)=>g.a.forEach(it=>it.g=gi));
const MIX=G.length; // 最後一顆按鈕＝全部混合
const KAI='"DFKai-SB","標楷體","BiauKai","TW-Kai","LXGW WenKai TC","KaiTi",serif';
const CW=1010,CH=864; // 迷宮畫布設計尺寸（橫向長方形）
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

let S={group:0,cols:9,rows:8,nMon:2,mix:.35,k:1,mons:[],score:100,inv:0,fx:null};

/* ---------- 16:9 縮放 ---------- */
function fit(){
  const k=Math.min(innerWidth/1600,innerHeight/900);S.k=k;
  stage.style.transform=`translate(${(innerWidth-1600*k)/2}px,${(innerHeight-900*k)/2}px) scale(${k})`;
  const s=k*(window.devicePixelRatio||1);S.dpr=s;
  cv.width=Math.round(CW*s);cv.height=Math.round(CH*s);
  if(S.walls)draw();
}

/* ---------- maze ---------- */
function genMaze(C,R){
  const w=[...Array(R)].map(()=>[...Array(C)].map(()=>({t:1,r:1,b:1,l:1})));
  const seen=[...Array(R)].map(()=>Array(C).fill(false));
  const act=[[rnd(C),rnd(R)]];seen[act[0][1]][act[0][0]]=true;
  const D=[[0,-1,'t','b'],[1,0,'r','l'],[0,1,'b','t'],[-1,0,'l','r']];
  while(act.length){
    const idx=Math.random()<S.mix?act.length-1:rnd(act.length);
    const [x,y]=act[idx];
    const nb=D.filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<C&&ny<R&&!seen[ny][nx]});
    if(!nb.length){act.splice(idx,1);continue}
    const [dx,dy,a,b]=nb[rnd(nb.length)];
    w[y][x][a]=0;w[y+dy][x+dx][b]=0;seen[y+dy][x+dx]=true;act.push([x+dx,y+dy]);
  }
  return w;
}
function canGo(x,y,dx,dy){const c=S.walls[y][x];return dx===1?!c.r:dx===-1?!c.l:dy===1?!c.b:!c.t}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function openNb(x,y){return DIRS.filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<S.cols&&ny<S.rows&&canGo(x,y,dx,dy)}).map(([dx,dy])=>[x+dx,y+dy])}
function bfs(){ // 從起點出發的步數與前一格
  const d={},prev={},q=[[0,0]],k=(x,y)=>x+','+y;d['0,0']=0;prev['0,0']=null;
  while(q.length){const [x,y]=q.shift();
    for(const [nx,ny] of openNb(x,y)){if(k(nx,ny) in d)continue;d[k(nx,ny)]=d[k(x,y)]+1;prev[k(nx,ny)]=[x,y];q.push([nx,ny])}}
  return {d,prev};
}
function solvePath(){
  const {prev}=bfs(),k=(x,y)=>x+','+y;
  const p=[];let cur=[S.cols-1,S.rows-1];while(cur){p.unshift(cur);cur=prev[k(cur[0],cur[1])]}
  return p;
}
function newGame(){
  let best=null;
  for(let t=0;t<12;t++){S.walls=genMaze(S.cols,S.rows);const p=solvePath();if(!best||p.length>best.p.length)best={w:S.walls,p}}
  S.walls=best.w;const path=best.p;
  let items=S.group<MIX?shuffle(G[S.group].a):shuffle(G.flatMap(g=>g.a)).slice(0,6);
  const k=Math.min(items.length,path.length-2);items=items.slice(0,k);
  S.cps=items.map((it,i)=>{const [x,y]=path[Math.round((i+1)*(path.length-1)/(k+1))];return {x,y,it,solved:false}});
  S.px=0;S.py=0;S.visited=new Set(['0,0']);S.wrong=0;S.steps=0;S.t0=Date.now();S.won=false;
  S.score=100;S.hits=0;S.inv=0;S.fx=null;spawnMonsters();
  renderGoal();updStats();draw();
}

/* ---------- 怪獸：沿著通道慢慢走，撞到小貓扣 10 分 ---------- */
const MON_MS=1100,HIT_PTS=10,INV_MS=2000;
const MON_COL=['#8E4FD9','#00A3A3','#D6336C'];
function spawnMonsters(){
  S.mons=[];if(!$('monOn').checked)return;
  const {d}=bfs(),far=Math.max(5,Math.floor((S.cols+S.rows)/2));
  const taken=c=>c[0]===S.cols-1&&c[1]===S.rows-1||S.cps.some(p=>p.x===c[0]&&p.y===c[1]);
  let cand=shuffle(Object.keys(d).filter(k=>d[k]>=far).map(k=>k.split(',').map(Number)).filter(c=>!taken(c)));
  for(let i=0;i<S.nMon&&cand.length;i++){
    const [x,y]=cand.shift();
    S.mons.push({ax:x,ay:y,bx:x,by:y,px:-1,py:-1,t:1,col:MON_COL[i%MON_COL.length],ph:Math.random()*6});
    cand=cand.filter(c=>Math.abs(c[0]-x)+Math.abs(c[1]-y)>=3);
  }
}
function monPos(m){const e=m.t<.5?2*m.t*m.t:1-2*(1-m.t)*(1-m.t);return [m.ax+(m.bx-m.ax)*e,m.ay+(m.by-m.ay)*e]}
function updateMons(dt,now){
  S.mons.forEach(m=>{
    m.ph+=dt/300;m.t+=dt/MON_MS;
    if(m.t>=1){ // 到了下一格，挑新方向（盡量不走回頭路）
      m.px=m.ax;m.py=m.ay;m.ax=m.bx;m.ay=m.by;
      let nb=openNb(m.ax,m.ay);const fwd=nb.filter(([x,y])=>!(x===m.px&&y===m.py));if(fwd.length)nb=fwd;
      [m.bx,m.by]=nb[rnd(nb.length)];m.t=0;
    }
  });
  if(now<S.inv)return;
  if(S.mons.some(m=>{const [x,y]=monPos(m);return Math.hypot(x-S.px,y-S.py)<.6}))hitMonster(now);
}
function hitMonster(now){
  S.score=Math.max(0,S.score-HIT_PTS);S.hits++;S.inv=now+INV_MS;S.fx={t:now,x:S.px,y:S.py};
  bonk();updStats();
  const box=$('sScoreBox');box.classList.remove('hit');void box.offsetWidth;box.classList.add('hit');
}
let lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(100,now-(lastT||now));lastT=now;
  if(!S.walls||!$('ov').hidden||S.won)return; // 答題、過關時怪獸暫停
  if(S.mons.length){updateMons(dt,now);draw(now)}
  else if(S.fx&&now-S.fx.t<1200)draw(now);
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(now){
  now=now||performance.now();
  const st=getComputedStyle(document.documentElement),css=v=>st.getPropertyValue(v).trim();
  const C=S.cols,R=S.rows,pad=8,cs=Math.min((CW-pad*2)/C,(CH-pad*2)/R),lw=Math.max(7,cs*.13);
  const ox=(CW-C*cs)/2,oy=(CH-R*cs)/2;
  ctx.setTransform(S.dpr||1,0,0,S.dpr||1,0,0);ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle=css('--path');ctx.fillRect(ox-pad,oy-pad,C*cs+pad*2,R*cs+pad*2);
  ctx.fillStyle=css('--trail');
  S.visited.forEach(v=>{const [x,y]=v.split(',').map(Number);ctx.fillRect(ox+x*cs,oy+y*cs,cs,cs)});
  const text=(t,x,y,size,col)=>{ctx.fillStyle=col;ctx.font=`${size}px ${KAI}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)};
  // 終點：貓咪的家
  drawHome(ox+(C-1)*cs,oy+(R-1)*cs,cs);

  S.cps.forEach(cp=>{
    const m=cs*.07;rr(ox+cp.x*cs+m,oy+cp.y*cs+m,cs-2*m,cs-2*m,cs*.14);
    ctx.fillStyle=cp.solved?css('--done'):css('--tile');ctx.fill();

    ctx.lineWidth=8;ctx.strokeStyle='#fff';ctx.lineJoin='round';const tx=ox+(S.fx.x+.5)*cs,ty=Math.max(oy+cs*.3,oy+(S.fx.y+.15)*cs-p*cs*.5);

function drawMonster(cx,cy,r,col,ph,tx,ty){
  cy+=Math.sin(ph)*r*.08;

  // 角
  ctx.fillStyle='#FFE45C';
  [-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(cx+d*r*.35,cy-r*.7);ctx.lineTo(cx+d*r*.6,cy-r*1.15);ctx.lineTo(cx+d*r*.7,cy-r*.55);ctx.closePath();ctx.fill();ctx.stroke()});
  // 身體：下緣波浪
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(cx-r,cy+r*.75);ctx.lineTo(cx-r,cy-r*.05);ctx.arc(cx,cy-r*.05,r,Math.PI,0);ctx.lineTo(cx+r,cy+r*.75);
  for(let i=0;i<4;i++){const x1=cx+r-(i+.5)*r/2,x2=cx+r-(i+1)*r/2;ctx.quadraticCurveTo(x1,cy+r*(i%2?.75:1.1)+Math.sin(ph*2+i)*r*.06,x2,cy+r*.75)}

  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx+Math.cos(a)*er*.42,ey+Math.sin(a)*er*.42,er*.45,0,Math.PI*2);ctx.fill();
  // 嘴巴＋牙齒
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(cx,cy+r*.48,r*.36,r*.14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';[-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(cx+d*r*.2,cy+r*.36);ctx.lineTo(cx+d*r*.08,cy+r*.36);ctx.lineTo(cx+d*r*.14,cy+r*.5);ctx.closePath();ctx.fill()});
  ctx.restore();
}
function drawCat(cx,cy,r){
  const fur='#F5922F';
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(3,r*.12);
  // 耳朵
  [-1,1].forEach(d=>{
    ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(cx+d*r*.95,cy-r*.05);ctx.lineTo(cx+d*r*.8,cy-r*1.05);ctx.lineTo(cx+d*r*.2,cy-r*.7);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#FFB3C6';ctx.beginPath();ctx.moveTo(cx+d*r*.78,cy-r*.3);ctx.lineTo(cx+d*r*.72,cy-r*.8);ctx.lineTo(cx+d*r*.4,cy-r*.6);ctx.closePath();ctx.fill();
  });
  // 臉
  ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(cx,cy+r*.12,r,r*.82,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // 額頭條紋
  ctx.strokeStyle='#B85A0E';ctx.lineWidth=Math.max(2,r*.09);
  [-.18,0,.18].forEach(o=>{ctx.beginPath();ctx.moveTo(cx+o*r,cy-r*.62);ctx.lineTo(cx+o*r,cy-r*.42);ctx.stroke()});
  // 眼睛
  ctx.fillStyle='#000';[-1,1].forEach(d=>{ctx.beginPath();ctx.ellipse(cx+d*r*.4,cy+r*.02,r*.13,r*.19,0,0,Math.PI*2);ctx.fill()});
  ctx.fillStyle='#fff';[-1,1].forEach(d=>{ctx.beginPath();ctx.arc(cx+d*r*.36,cy-r*.06,r*.05,0,Math.PI*2);ctx.fill()});
  // 鼻子、嘴巴
  ctx.fillStyle='#E0457B';ctx.beginPath();ctx.moveTo(cx-r*.11,cy+r*.24);ctx.lineTo(cx+r*.11,cy+r*.24);ctx.lineTo(cx,cy+r*.36);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=Math.max(2,r*.07);ctx.beginPath();
  ctx.moveTo(cx,cy+r*.36);ctx.quadraticCurveTo(cx-r*.08,cy+r*.52,cx-r*.24,cy+r*.45);
  ctx.moveTo(cx,cy+r*.36);ctx.quadraticCurveTo(cx+r*.08,cy+r*.52,cx+r*.24,cy+r*.45);ctx.stroke();

  [-1,1].forEach(d=>[-.07,.07].forEach(o=>{ctx.beginPath();ctx.moveTo(cx+d*r*.55,cy+r*(.32+o));ctx.lineTo(cx+d*r*1.18,cy+r*(.26+o*2.4));ctx.stroke()}));

}
function drawHome(x0,y0,cs){
  const cx=x0+cs/2,m=cs*.1,base=y0+cs-m,w=cs*.66,h=cs*.38,eave=base-h,top=y0+m*.9;
  ctx.save();ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(3,cs*.04);
  // 屋頂上的貓耳朵
  ctx.fillStyle='#D7263D';
  [-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(cx+d*cs*.1,top+cs*.08);ctx.lineTo(cx+d*cs*.2,top-cs*.02);ctx.lineTo(cx+d*cs*.26,top+cs*.17);ctx.closePath();ctx.fill();ctx.stroke()});
  // 牆

  // 屋頂
  ctx.fillStyle='#D7263D';ctx.beginPath();ctx.moveTo(cx-w/2-cs*.09,eave);ctx.lineTo(cx,top+cs*.04);ctx.lineTo(cx+w/2+cs*.09,eave);ctx.closePath();ctx.fill();ctx.stroke();

  [-1.3,0,1.3].forEach(o=>{ctx.beginPath();ctx.arc(cx+o*pr,py-pr*(o?1:1.5),pr*.5,0,Math.PI*2);ctx.fill()});
  // 拱門

  ctx.moveTo(cx-dw/2,base);ctx.lineTo(cx-dw/2,base-dh+dw/2);ctx.arc(cx,base-dh+dw/2,dw/2,Math.PI,0);ctx.lineTo(cx+dw/2,base);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}

/* ---------- movement ---------- */
function move(dx,dy){
  if(!$('ov').hidden||S.won)return;
  const nx=S.px+dx,ny=S.py+dy;
  if(nx<0||ny<0||nx>=S.cols||ny>=S.rows||!canGo(S.px,S.py,dx,dy))return;
  const cp=S.cps.find(c=>c.x===nx&&c.y===ny&&!c.solved);
  if(cp){openQuiz(cp);return}
  step(nx,ny);
}
function step(x,y){
  S.px=x;S.py=y;S.steps++;S.visited.add(x+','+y);updStats();draw();
  if(x===S.cols-1&&y===S.rows-1)win();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('ov').hidden&&!S.won){closeQuiz();return}
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if(m&&$('ov').hidden){e.preventDefault();move(...m)}
});
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('click',()=>move(...b.dataset.d.split(',').map(Number))));
let sw=null;
cv.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))>20){Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy));return}
  const b=cv.getBoundingClientRect(),f=CW/b.width;
  const cx=Math.floor(((e.clientX-b.left)*f-S.ox)/S.cs),cy=Math.floor(((e.clientY-b.top)*f-S.oy)/S.cs);
  const ddx=cx-S.px,ddy=cy-S.py;if(Math.abs(ddx)+Math.abs(ddy)===1)move(ddx,ddy);
});

/* ---------- 慶祝：聲音與彩帶 ---------- */
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,dur,type='triangle',vol=.18){
  const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);
  const t=a.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t);o.stop(t+dur+.05);
}
function fanfare(){[[523,0,.18],[659,.16,.18],[784,.32,.18],[1047,.48,.6]].forEach(([f,t,d])=>tone(f,t,d));
  [523,659,784].forEach(f=>tone(f,.48,.6,'sine',.08))}
function bonk(){tone(330,0,.12,'square',.14);tone(165,.1,.3,'square',.14)}
function meow(){
  const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter(),t=a.currentTime;
  o.type='sawtooth';lp.type='lowpass';lp.frequency.value=1800;o.connect(lp);lp.connect(g);g.connect(a.destination);
  const base=520+Math.random()*120;
  o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.6,t+.18);o.frequency.linearRampToValueAtTime(base*.9,t+.55);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.06);g.gain.linearRampToValueAtTime(.12,t+.35);g.gain.exponentialRampToValueAtTime(.001,t+.6);
  o.start(t);o.stop(t+.65);
}
const party=$('party'),pctx=party.getContext('2d');let bits=[],raf=0,partyEnd=0;
const PARTY_MS=2000,FADE_MS=500; // 彩帶只撒 2 秒，最後 0.5 秒淡出
function stopParty(){bits=[];partyEnd=0;if(raf){cancelAnimationFrame(raf);raf=0}pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,party.width,party.height)}
function confetti(colors,emojis,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  partyEnd=performance.now()+PARTY_MS;
  clearTimeout(confetti.tm);confetti.tm=setTimeout(stopParty,PARTY_MS+100); // 保險：畫面暫停時也會清掉
  for(let i=0;i<n;i++){
    const useEmoji=!colors.length||Math.random()<.25;
    bits.push({x:Math.random()*1600,y:-40-Math.random()*200,vx:(Math.random()-.5)*3,vy:5+Math.random()*5,
      r:Math.random()*6,vr:(Math.random()-.5)*.2,
      e:useEmoji?emojis[rnd(emojis.length)]:null,c:colors[rnd(colors.length||1)],s:useEmoji?44+Math.random()*30:14+Math.random()*12});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  const s=S.k*(window.devicePixelRatio||1);
  party.width=Math.round(1600*s);party.height=Math.round(900*s);pctx.setTransform(s,0,0,s,0,0);
  const left=partyEnd-performance.now();
  if(left<=0)bits=[];
  bits=bits.filter(b=>b.y<960);
  pctx.globalAlpha=Math.min(1,Math.max(0,left/FADE_MS));
  bits.forEach(b=>{b.x+=b.vx+Math.sin(b.y/60);b.y+=b.vy;b.r+=b.vr;
    pctx.save();pctx.translate(b.x,b.y);pctx.rotate(b.r);
    if(b.e){pctx.font=`${b.s}px sans-serif`;pctx.textAlign='center';pctx.textBaseline='middle';pctx.fillText(b.e,0,0)}
    else{pctx.fillStyle=b.c;pctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2)}
    pctx.restore()});
  raf=bits.length?requestAnimationFrame(tick):0;
  if(!raf)pctx.clearRect(0,0,1600,900);
}

$('groups').innerHTML=names.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
$('groups').onchange=e=>{setGroup(+e.target.value);e.target.blur()};
$('size').onchange=e=>{[S.cols,S.rows,S.nMon]=e.target.value.split(',').map(Number);newGame()};
$('monOn').onchange=()=>{spawnMonsters();draw()};
$('newMaze').onclick=newGame;
$('showRef').onclick=showRef;

window.addEventListener('resize',fit);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw())}catch(e){}
new MutationObserver(()=>S.walls&&draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
fit();newGame();requestAnimationFrame(loop);
(document.fonts?document.fonts.load('700 40px "LXGW WenKai TC"','梢悄稍銷消捎協荔脅勞榮營律津筆建諸賭堵睹終起').then(()=>document.fonts.ready):Promise.resolve()).then(()=>draw()).catch(()=>{});
</script>
